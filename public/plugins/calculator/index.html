<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8">
  <title>Kalkulačka Plugin</title>
  <style>
    :root {
      --bg: #0d0e15;
      --panel-bg: rgba(255, 255, 255, 0.03);
      --border: rgba(255, 255, 255, 0.06);
      --text: #f3f4f6;
      --text-secondary: #9ca3af;
      --accent: #8b5cf6;
      --accent-hover: #7c3aed;
      --btn-bg: rgba(255, 255, 255, 0.05);
      --btn-hover: rgba(255, 255, 255, 0.1);
      --operator-bg: rgba(139, 92, 246, 0.2);
      --operator-hover: rgba(139, 92, 246, 0.3);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background: var(--bg);
      color: var(--text);
      display: flex;
      flex-direction: column;
      height: 100vh;
      width: 100vw;
      overflow: hidden;
      padding: 16px;
    }

    .toolbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
      gap: 8px;
    }

    .tool-btn {
      flex: 1;
      background: var(--btn-bg);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 8px 12px;
      font-size: 0.75rem;
      font-weight: 600;
      border-radius: 6px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: all 0.2s ease;
    }

    .tool-btn:hover {
      background: var(--btn-hover);
      transform: translateY(-1px);
    }

    .tool-btn:active {
      transform: translateY(0);
    }

    .tool-btn.accent {
      background: var(--accent);
      border-color: var(--accent);
    }

    .tool-btn.accent:hover {
      background: var(--accent-hover);
    }

    .calc-container {
      flex: 1;
      display: flex;
      flex-direction: column;
      background: var(--panel-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 16px;
      gap: 16px;
      max-width: 360px;
      margin: 0 auto;
      width: 100%;
    }

    .display {
      width: 100%;
      height: 60px;
      background: rgba(0, 0, 0, 0.2);
      border: 1px solid var(--border);
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: flex-end;
      padding: 0 16px;
      font-size: 2rem;
      font-weight: 300;
      overflow: hidden;
      white-space: nowrap;
      text-overflow: clip;
      color: #fff;
    }

    .grid {
      flex: 1;
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
    }

    button.calc-btn {
      border: none;
      background: var(--btn-bg);
      color: var(--text);
      font-size: 1.25rem;
      font-weight: 500;
      border-radius: 8px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.15s ease;
    }

    button.calc-btn:hover {
      background: var(--btn-hover);
      transform: scale(1.03);
    }

    button.calc-btn:active {
      transform: scale(0.98);
    }

    button.calc-btn.operator {
      background: var(--operator-bg);
      color: var(--accent);
      font-weight: 600;
    }

    button.calc-btn.operator:hover {
      background: var(--operator-hover);
    }

    button.calc-btn.action {
      background: rgba(255, 255, 255, 0.02);
      color: var(--text-secondary);
    }

    button.calc-btn.equals {
      background: var(--accent);
      color: #fff;
      grid-column: span 1;
    }

    button.calc-btn.equals:hover {
      background: var(--accent-hover);
    }

    .log-container {
      margin-top: 12px;
      font-size: 0.7rem;
      color: var(--text-secondary);
      text-align: center;
      background: rgba(0, 0, 0, 0.1);
      padding: 6px;
      border-radius: 4px;
      border: 1px solid var(--border);
    }
  </style>
</head>
<body>

  <!-- Testovací horní panel -->
  <div class="toolbar">
    <button class="tool-btn accent" id="notify-btn">
      🔔 Notifikace
    </button>
    <button class="tool-btn" id="save-btn">
      💾 Uložit výsledek
    </button>
    <button class="tool-btn" id="load-btn">
      📂 Načíst uložený
    </button>
  </div>

  <!-- Tělo kalkulačky -->
  <div class="calc-container">
    <div class="display" id="display">0</div>
    <div class="grid">
      <button class="calc-btn action" onclick="clearDisplay()">C</button>
      <button class="calc-btn action" onclick="appendOperator('%')">%</button>
      <button class="calc-btn action" onclick="backspace()">⌫</button>
      <button class="calc-btn operator" onclick="appendOperator('/')">/</button>

      <button class="calc-btn" onclick="appendNumber('7')">7</button>
      <button class="calc-btn" onclick="appendNumber('8')">8</button>
      <button class="calc-btn" onclick="appendNumber('9')">9</button>
      <button class="calc-btn operator" onclick="appendOperator('*')">*</button>

      <button class="calc-btn" onclick="appendNumber('4')">4</button>
      <button class="calc-btn" onclick="appendNumber('5')">5</button>
      <button class="calc-btn" onclick="appendNumber('6')">6</button>
      <button class="calc-btn operator" onclick="appendOperator('-')">-</button>

      <button class="calc-btn" onclick="appendNumber('1')">1</button>
      <button class="calc-btn" onclick="appendNumber('2')">2</button>
      <button class="calc-btn" onclick="appendNumber('3')">3</button>
      <button class="calc-btn operator" onclick="appendOperator('+')">+</button>

      <button class="calc-btn" onclick="appendNumber('0')" style="grid-column: span 2;">0</button>
      <button class="calc-btn" onclick="appendNumber('.')">.</button>
      <button class="calc-btn equals" onclick="calculate()">=</button>
    </div>
  </div>

  <div class="log-container" id="status-bar">
    Inicializováno. Načtené tokeny připraveny.
  </div>

  <script>
    // 1. Získáme relační tokeny z URL adresy předané systémem
    const params = new URLSearchParams(window.location.search);
    const windowId = params.get('windowId');
    const token = params.get('token');
    const origin = params.get('origin');

    const display = document.getElementById('display');
    const statusBar = document.getElementById('status-bar');
    let currentInput = '0';
    let shouldResetDisplay = false;

    if (windowId && token) {
      statusBar.innerText = `Připojeno k OS (Window ID: ${windowId.substring(0, 8)}...)`;
    } else {
      statusBar.innerText = '⚠️ Běží mimo Canvas OS shell!';
      statusBar.style.color = '#EF4444';
    }

    // Funkce kalkulačky
    function updateDisplay() {
      display.innerText = currentInput;
    }

    function appendNumber(num) {
      if (currentInput === '0' || shouldResetDisplay) {
        currentInput = num;
        shouldResetDisplay = false;
      } else {
        currentInput += num;
      }
      updateDisplay();
    }

    function appendOperator(op) {
      if (shouldResetDisplay) shouldResetDisplay = false;
      const lastChar = currentInput.slice(-1);
      if (['+', '-', '*', '/', '%'].includes(lastChar)) {
        currentInput = currentInput.slice(0, -1) + op;
      } else {
        currentInput += op;
      }
      updateDisplay();
    }

    function clearDisplay() {
      currentInput = '0';
      updateDisplay();
    }

    function backspace() {
      if (currentInput.length > 1) {
        currentInput = currentInput.slice(0, -1);
      } else {
        currentInput = '0';
      }
      updateDisplay();
    }

    function calculate() {
      try {
        // Velmi bezpečné vyhodnocení, jelikož běžíme v izolovaném sandboxu s originem "null"
        const result = eval(currentInput);
        currentInput = String(result);
        shouldResetDisplay = true;
        updateDisplay();
      } catch (e) {
        currentInput = 'Chyba';
        shouldResetDisplay = true;
        updateDisplay();
      }
    }

    // 2. Propojení s parent oknem (API Bridge)
    const notifyBtn = document.getElementById('notify-btn');
    const saveBtn = document.getElementById('save-btn');
    const loadBtn = document.getElementById('load-btn');

    // Akce: Odeslat notifikaci
    notifyBtn.addEventListener('click', () => {
      if (!windowId || !token) return;
      window.parent.postMessage({
        windowId,
        token,
        action: 'canvas-os:notification',
        payload: {
          message: `Výpočet na kalkulačce: ${display.innerText}`
        }
      }, '*');
      
      statusBar.innerText = 'Notifikace odeslána hostiteli.';
      setTimeout(() => statusBar.innerText = 'Připojeno k OS.', 2000);
    });

    // Akce: Uložit stav přes hostitele (perzistentní storage)
    saveBtn.addEventListener('click', () => {
      if (!windowId || !token) return;
      window.parent.postMessage({
        windowId,
        token,
        action: 'canvas-os:storage:set',
        payload: {
          key: 'last_calc_result',
          value: display.innerText
        },
        requestId: 'req_save_result'
      }, '*');
    });

    // Akce: Načíst stav přes hostitele
    loadBtn.addEventListener('click', () => {
      if (!windowId || !token) return;
      window.parent.postMessage({
        windowId,
        token,
        action: 'canvas-os:storage:get',
        payload: {
          key: 'last_calc_result'
        },
        requestId: 'req_load_result'
      }, '*');
    });

    // 3. Naslouchání odpovědím z hostitelského OS
    window.addEventListener('message', (e) => {
      const data = e.data;
      if (data && data.action === 'canvas-os:response') {
        if (data.requestId === 'req_save_result') {
          if (data.success) {
            statusBar.innerText = '✓ Výsledek úspěšně uložen do DB!';
            saveBtn.style.background = '#22C55E';
            setTimeout(() => {
              saveBtn.style.background = 'var(--btn-bg)';
              statusBar.innerText = 'Připojeno k OS.';
            }, 2000);
          } else {
            statusBar.innerText = `❌ Selhalo uložení: ${data.error}`;
          }
        }
        
        if (data.requestId === 'req_load_result') {
          if (data.success) {
            if (data.payload !== null) {
              currentInput = data.payload;
              shouldResetDisplay = true;
              updateDisplay();
              statusBar.innerText = '✓ Výsledek načten z DB!';
            } else {
              statusBar.innerText = 'ℹ️ Žádná uložená hodnota nenalezena.';
            }
            loadBtn.style.background = '#3B82F6';
            setTimeout(() => {
              loadBtn.style.background = 'var(--btn-bg)';
              statusBar.innerText = 'Připojeno k OS.';
            }, 2000);
          } else {
            statusBar.innerText = `❌ Selhalo načtení: ${data.error}`;
          }
        }
      }
    });
  </script>
</body>
</html>
