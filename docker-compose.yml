version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        - VITE_APPWRITE_ENDPOINT=https://appwrite.propoj.app/v1
        - VITE_APPWRITE_PROJECT_ID=69effdf6003ce697ee83
    container_name: propoj-canvas-os
    restart: unless-stopped
    networks:
      - appwrite
    labels:
      - "traefik.enable=true"
      # HTTP Router Configuration
      - "traefik.http.routers.propoj-os.rule=Host(`propoj.app`) || Host(`www.propoj.app`)"
      - "traefik.http.routers.propoj-os.entrypoints=websecure"
      - "traefik.http.routers.propoj-os.tls=true"
      - "traefik.http.routers.propoj-os.tls.certresolver=letsencrypt"
      # Service definition for port mapping
      - "traefik.http.services.propoj-os.loadbalancer.server.port=80"
      # Security and compress headers
      - "traefik.http.routers.propoj-os.middlewares=propoj-os-headers"
      - "traefik.http.middlewares.propoj-os-headers.headers.browserXssFilter=true"
      - "traefik.http.middlewares.propoj-os-headers.headers.contentTypeNosniff=true"
      - "traefik.http.middlewares.propoj-os-headers.headers.forceSTSHeader=true"
      - "traefik.http.middlewares.propoj-os-headers.headers.sslRedirect=true"
      - "traefik.http.middlewares.propoj-os-headers.headers.stsSeconds=31536000"

networks:
  appwrite:
    external: true
